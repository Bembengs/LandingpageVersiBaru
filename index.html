<script>// === GLOBAL EXPORT/IMPORT ICON ONLY TOP-LEFT (FIXED ROBUST) ===
(function(){
  const BLOCKS_KEY = 'google-portal-blocks';
  const HERO_KEY = 'google-portal-hero';
  const QUICK_KEY = 'tautan-cepat-editable-v1';
  const ROW_TITLES_KEY = 'row-titles-editable-v1';
  const FAVS_KEY = 'chrome-favorites-apps-v1';
  const CAL_KEY_LOCAL = 'google-calendar-events-v1';
  function safeParse(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
  function safeParseArray(k){ const v=safeParse(k); return Array.isArray(v)?v:[]; }
  function downloadJSON(d,f){const j=JSON.stringify(d,null,2);const b=new Blob([j],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=f;document.body.appendChild(a);a.click();setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(u)},600)}
  function exportAllPortal(){
    // Pastikan selalu array, bukan null, agar file backup valid
    const blocksRaw = safeParse(BLOCKS_KEY);
    const quickRaw = safeParse(QUICK_KEY);
    const favRaw = safeParse(FAVS_KEY);
    const calRaw = safeParse(CAL_KEY_LOCAL);
    const payload={
      version:3,
      exportedAt:new Date().toISOString(),
      app:'bbgtk-portal-lengkap',
      blocks: Array.isArray(blocksRaw) ? blocksRaw : [],
      hero: safeParse(HERO_KEY),
      quickLinks: Array.isArray(quickRaw) ? quickRaw : [],
      rowTitles: safeParse(ROW_TITLES_KEY),
      favorites: Array.isArray(favRaw) ? favRaw : (favRaw || null),
      calendar: Array.isArray(calRaw) ? calRaw : (calRaw || null)
    };
    downloadJSON(payload,'portal-bbgtk-lengkap-'+new Date().toISOString().slice(0,10)+'.json');
  }
  function isBlocksArray(arr){
    return Array.isArray(arr) && arr.length>0 && arr[0] && typeof arr[0].type==='string';
  }
  function isQuickLinksArray(arr){
    return Array.isArray(arr) && arr.length>0 && arr[0] && (typeof arr[0].text==='string' || typeof arr[0].url==='string') && !arr[0].type;
  }
  function importAllPortal(file){
    const reader=new FileReader();
    reader.onload=function(e){
      try{
        const parsed=JSON.parse(e.target.result);
        let blocks=null;
        let quick=null;
        let hero=null;
        let titles=null;
        let favs=null;
        let cal=null;

        // --- Deteksi format file ---
        if(Array.isArray(parsed)){
          if(isBlocksArray(parsed)){
            blocks=parsed;
          }else if(isQuickLinksArray(parsed) || (parsed.length>0 && parsed[0].text)){
            quick=parsed;
          }else if(parsed.length===0){
            // kosong, anggap tidak ada
            blocks=[];
          }else{
            // fallback: coba tebak
            if(parsed[0] && parsed[0].type) blocks=parsed;
            else quick=parsed;
          }
        }else if(parsed && typeof parsed==='object'){
          // Format global lengkap v3
          if(Array.isArray(parsed.blocks)) blocks=parsed.blocks;
          // Format backup-landing.json {hero, blocks}
          else if(parsed.blocks && Array.isArray(parsed.blocks)) blocks=parsed.blocks;

          // quickLinks bisa ada di berbagai tempat
          if(Array.isArray(parsed.quickLinks)) quick=parsed.quickLinks;
          else if(parsed.quickLinks && Array.isArray(parsed.quickLinks.data)) quick=parsed.quickLinks.data;

          // Format tautan-cepat backup {app:'tautan-cepat-bbgtk', data:[...]}
          if(!quick && Array.isArray(parsed.data)){
            if(parsed.data.length>0 && parsed.data[0] && parsed.data[0].text){
              quick=parsed.data;
            }else if(parsed.data.length>0 && parsed.data[0] && parsed.data[0].type){
              if(!blocks) blocks=parsed.data;
            }
          }

          // Jika file adalah backup tautan cepat tapi dibungkus {data: [...]} dan app mengandung tautan-cepat
          if(!blocks && !quick && parsed.app && String(parsed.app).includes('tautan-cepat') && Array.isArray(parsed.data)){
            quick=parsed.data;
          }

          // hero, titles, favs, cal
          if(parsed.hero) hero=parsed.hero;
          if(parsed.rowTitles) titles=parsed.rowTitles;
          if(parsed.favorites) favs=parsed.favorites;
          if(parsed.calendar) cal=parsed.calendar;
          // old backup-landing juga punya hero
          if(!hero && parsed.hero) hero=parsed.hero;
        }

        // Validasi minimal
        const hasBlocks = Array.isArray(blocks);
        const hasQuick = Array.isArray(quick);
        if(!hasBlocks && !hasQuick && !hero && !titles && !favs && !cal){
          alert('Import gagal: File tidak mengandung data portal yang valid.\nPastikan file adalah hasil ekspor portal lengkap, backup-landing, atau tautan cepat.');
          return;
        }

        const mode=confirm('OK = GABUNG, Cancel = GANTI SEMUA')?'merge':'replace';
        const totalBlocks = hasBlocks ? blocks.length : 0;
        const totalQuick = hasQuick ? quick.length : 0;
        if(!confirm('Import Mode: '+mode.toUpperCase()+'\nBlok Icon: '+totalBlocks+'\nTautan Cepat: '+totalQuick+'\nLanjut?')) return;

        if(hasBlocks){
          if(mode==='replace'){
            localStorage.setItem(BLOCKS_KEY,JSON.stringify(blocks));
          }else{
            const exRaw=safeParse(BLOCKS_KEY);
            const ex=Array.isArray(exRaw)?exRaw:[];
            const merged=ex.slice();
            const ids=new Set(ex.map(function(b){ return b && b.id; }).filter(Boolean));
            blocks.forEach(function(nb){
              if(!nb || !nb.id){ merged.push(nb); return; }
              if(!ids.has(nb.id)){
                merged.push(nb);
              }else{
                const idx=merged.findIndex(function(b){ return b.id===nb.id; });
                if(idx>=0 && merged[idx].type==='row' && nb.type==='row'){
                  const map=new Map();
                  (merged[idx].apps||[]).forEach(function(a){ if(a && a.title && a.url) map.set((a.title+'|'+a.url).toLowerCase(), a); });
                  (nb.apps||[]).forEach(function(a){ if(!a || !a.title || !a.url) return; const k=(a.title+'|'+a.url).toLowerCase(); if(!map.has(k)) map.set(k,a); });
                  merged[idx].apps=Array.from(map.values());
                }
              }
            });
            localStorage.setItem(BLOCKS_KEY,JSON.stringify(merged));
          }
        }

        if(hasQuick){
          const qMode=confirm('Tautan Cepat: OK=GABUNG, Cancel=GANTI')?'merge':'replace';
          if(qMode==='replace'){
            localStorage.setItem(QUICK_KEY,JSON.stringify(quick));
          }else{
            const exQRaw=safeParse(QUICK_KEY);
            const exQ=Array.isArray(exQRaw)?exQRaw:[];
            const mapQ=new Map();
            exQ.forEach(function(x){ if(x && x.text && x.url) mapQ.set((x.text+'|'+x.url).toLowerCase(), x); });
            const quickArr = Array.isArray(quick) ? quick : (quick.data||[]);
            quickArr.forEach(function(x){
              if(!x || !x.text || !x.url) return;
              const k=(x.text+'|'+x.url).toLowerCase();
              if(!mapQ.has(k)) mapQ.set(k,x);
            });
            localStorage.setItem(QUICK_KEY,JSON.stringify(Array.from(mapQ.values())));
          }
        }

        if(hero) localStorage.setItem(HERO_KEY,JSON.stringify(hero));
        if(titles) localStorage.setItem(ROW_TITLES_KEY,JSON.stringify(titles));
        if(favs) localStorage.setItem(FAVS_KEY,JSON.stringify(favs));
        if(cal) localStorage.setItem(CAL_KEY_LOCAL,JSON.stringify(cal));

        alert('Import berhasil! Reload...');
        location.reload();
      }catch(err){
        console.error(err);
        alert('JSON tidak valid: '+err.message);
      }
    };
    reader.readAsText(file);
  }
  function createTopLeftIcons(){
    if(document.getElementById('portalIOFloat'))return true;
    const wrap=document.createElement('div');
    wrap.id='portalIOFloat';
    wrap.innerHTML='<input type="file" id="portalImportFile" accept=".json,application/json" style="display:none" /><button class="io-icon-btn" id="portalImportBtn" data-tip="Impor" aria-label="Impor"><i class="bi bi-upload"></i></button><button class="io-icon-btn" id="portalExportBtn" data-tip="Ekspor" aria-label="Ekspor"><i class="bi bi-download"></i></button>';
    document.body.appendChild(wrap);
    document.getElementById('portalExportBtn').addEventListener('click',exportAllPortal);
    document.getElementById('portalImportBtn').addEventListener('click',()=>document.getElementById('portalImportFile').click());
    document.getElementById('portalImportFile').addEventListener('change',function(){if(this.files&&this.files[0])importAllPortal(this.files[0]);this.value='';});
    return true;
  }
  let t=0;const iv=setInterval(()=>{if(createTopLeftIcons()||t>20)clearInterval(iv);t++;},600);
  setTimeout(createTopLeftIcons,800);setTimeout(createTopLeftIcons,2200);
  window._portalIO={exportAll:exportAllPortal,importAll:importAllPortal};
})();

<script>
// === PATCH FAVICON ROBUST - FIXED PATH-AWARE ===
(function(){
  function resolveGoogleIcon(url){
    try{
      const u = new URL(url.startsWith('http')?url:'https://'+url);
      const h = u.hostname.toLowerCase();
      const p = u.pathname.toLowerCase();
      if(h==='sheets.google.com' || (h==='docs.google.com' && p.includes('/spreadsheets'))) return 'https://ssl.gstatic.com/images/branding/product/1x/sheets_2020q4_48dp.png';
      if(h==='slides.google.com' || (h==='docs.google.com' && p.includes('/presentation'))) return 'https://ssl.gstatic.com/images/branding/product/1x/slides_2020q4_48dp.png';
      if(h==='forms.google.com' || (h==='docs.google.com' && p.includes('/forms'))) return 'https://ssl.gstatic.com/images/branding/product/1x/forms_2020q4_48dp.png';
      if(h==='docs.google.com'){
        if(p.includes('/drawings')) return 'https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_48dp.png';
        return 'https://ssl.gstatic.com/images/branding/product/1x/docs_2020q4_48dp.png';
      }
      return null;
    }catch(e){return null}
  }

  const MAP = {
    'docs.google.com':'https://ssl.gstatic.com/images/branding/product/1x/docs_2020q4_48dp.png',
    'sheets.google.com':'https://ssl.gstatic.com/images/branding/product/1x/sheets_2020q4_48dp.png',
    'slides.google.com':'https://ssl.gstatic.com/images/branding/product/1x/slides_2020q4_48dp.png',
    'drive.google.com':'https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_48dp.png',
    'mail.google.com':'https://ssl.gstatic.com/images/branding/product/1x/gmail_2020q4_48dp.png',
    'calendar.google.com':'https://ssl.gstatic.com/images/branding/product/1x/calendar_2020q4_48dp.png',
    'meet.google.com':'https://ssl.gstatic.com/images/branding/product/1x/meet_2020q4_48dp.png',
    'chat.google.com':'https://ssl.gstatic.com/images/branding/product/1x/chat_2020q4_48dp.png',
    'keep.google.com':'https://ssl.gstatic.com/images/branding/product/1x/keep_2020q4_48dp.png',
    'forms.google.com':'https://ssl.gstatic.com/images/branding/product/1x/forms_2020q4_48dp.png',
    'photos.google.com':'https://ssl.gstatic.com/images/branding/product/1x/photos_2020q4_48dp.png',
    'maps.google.com':'https://ssl.gstatic.com/images/branding/product/1x/maps_2020q4_48dp.png',
    'classroom.google.com':'https://ssl.gstatic.com/images/branding/product/1x/classroom_2020q4_48dp.png',
    'youtube.com':'https://www.youtube.com/s/desktop/12d6b690/img/favicon_32x32.png',
    'www.youtube.com':'https://www.youtube.com/s/desktop/12d6b690/img/favicon_32x32.png',
    'youtu.be':'https://www.youtube.com/s/desktop/12d6b690/img/favicon_32x32.png'
  };

    function candidatesFor(url){
    try{
      const u = new URL(url.startsWith('http')?url:'https://'+url);
      const h = u.hostname.toLowerCase();
      const list=[];
      const gIcon = resolveGoogleIcon(url);
      if(gIcon) list.push(gIcon);
      else if(MAP[h]) list.push(MAP[h]);
      list.push('https://t3.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url='+encodeURIComponent(u.href)+'&size=128');
      list.push('https://www.google.com/s2/favicons?domain_url='+encodeURIComponent(u.href)+'&sz=128');
      list.push('https://www.google.com/s2/favicons?domain='+h+'&sz=128');
      list.push('https://icons.duckduckgo.com/ip3/'+h+'.ico');
      list.push('https://api.faviconkit.com/'+h+'/128');
      list.push('https://'+h+'/favicon.ico');
      list.push('https://'+h+'/favicon.png');
      list.push('https://'+h+'/apple-touch-icon.png');
      if(window.GENERIC_FALLBACK_ICON) list.push(window.GENERIC_FALLBACK_ICON);
      return [...new Set(list)];
    }catch(e){ return []; }
  }

  function upgradeStoredBlocks(){
    try{
      const key='google-portal-blocks';
      const raw=localStorage.getItem(key);
      if(!raw) return;
      const blocks=JSON.parse(raw);
      if(!Array.isArray(blocks)) return;
      let changed=false;
      blocks.forEach(b=>{
        if(b.type==='row' && Array.isArray(b.apps)){
          b.apps.forEach(app=>{
            try{
              const correct = resolveGoogleIcon(app.url) || MAP[new URL(app.url).hostname.toLowerCase()];
              if(correct && app.icon!==correct){
                // only auto-upgrade if previous icon was generic s2 or wrong docs icon for sheets/slides/forms
                if(!app.icon || app.icon.includes('s2/favicons') || app.icon.includes('google.com/favicon') || app.icon.includes('docs_2020q4') && correct!==app.icon){
                  // For docs.google.com paths, we should upgrade docs->sheets etc
                  if(app.url.toLowerCase().includes('/spreadsheets') || app.url.toLowerCase().includes('/presentation') || app.url.toLowerCase().includes('/forms')){
                    app.icon=correct;
                    changed=true;
                  } else if(!app.icon || app.icon.includes('s2/favicons')){
                    // keep lightweight, icon resolved at render
                  }
                }
              }
            }catch(e){}
          });
        }
      });
      if(changed){
        localStorage.setItem(key, JSON.stringify(blocks));
      }
    }catch(e){}
  }

  function upgradeFavsStorage(){
    try{
      const STORAGE_KEY='chrome-favorites-apps-v1';
      const raw=localStorage.getItem(STORAGE_KEY);
      if(!raw) return;
      const favs=JSON.parse(raw);
      if(!Array.isArray(favs)) return;
      let changed=false;
      favs.forEach(f=>{
        try{
          const correct = resolveGoogleIcon(f.url) || MAP[new URL(f.url).hostname.toLowerCase()];
          if(correct && f.icon!==correct){
            // Upgrade if icon is generic s2 or if it's docs icon but should be sheets/slides/forms
            if(!f.icon || f.icon.includes('s2/favicons') || f.icon.includes('google.com/favicon')){
              f.icon=correct;
              changed=true;
            } else if(f.icon.includes('docs_2020q4_48dp.png') && correct!==f.icon){
              // previously showed docs for sheets/slides/forms - fix it
              if(f.url.toLowerCase().includes('/spreadsheets') || f.url.toLowerCase().includes('/presentation') || f.url.toLowerCase().includes('/forms') || f.url.toLowerCase().includes('sheets.google.com') || f.url.toLowerCase().includes('slides.google.com')){
                f.icon=correct;
                changed=true;
              }
            }
          }
        }catch(e){}
      });
      if(changed){
        localStorage.setItem(STORAGE_KEY, JSON.stringify(favs));
      }
    }catch(e){}
  }

  // Enhance all favicon images with retry chain - path-aware
    function enhanceImages(){
    const imgs = document.querySelectorAll('.icon-wrapper img, .fav-icon-wrap img');
    imgs.forEach(img=>{
      if(img.dataset.faviconPatched) return;
      let url = '';
      const link = img.closest('a');
      if(link && link.href) url = link.href;
      if(!url) return;
      const cands = candidatesFor(url);
      if(!cands.length) return;
      let currentIdx = cands.indexOf(img.src);
      if(currentIdx===-1) currentIdx = -1;
      img.dataset.faviconPatched='1';
      img.dataset.cands = JSON.stringify(cands);
      img.dataset.candIdx = currentIdx;
      img.dataset.title = (img.alt||'');
      img.dataset.pageUrl = url;
      img.addEventListener('error', function handler(){
        let idx = parseInt(this.dataset.candIdx||'-1')+1;
        const list = JSON.parse(this.dataset.cands||'[]');
        if(idx < list.length){
          this.dataset.candIdx = idx;
          this.src = list[idx];
        }else{
          this.removeEventListener('error', handler);
          // Try custom letter favicon (buatan sendiri)
          if(window.generateLetterFavicon){
            try{
              const title = this.dataset.title||'?';
              const pageUrl = this.dataset.pageUrl||'';
              const letterUrl = window.generateLetterFavicon(title, pageUrl);
              if(letterUrl){
                this.src = letterUrl;
                this.style.display='';
                this.style.width='100%';
                this.style.height='100%';
                this.style.objectFit='cover';
                this.style.borderRadius='50%';
                return;
              }
            }catch(e){}
          }
          if(window.GENERIC_FALLBACK_ICON && this.src !== window.GENERIC_FALLBACK_ICON){
            this.src = window.GENERIC_FALLBACK_ICON;
            this.style.display='';
            this.style.width='100%';
            this.style.height='100%';
            this.style.objectFit='cover';
            this.style.borderRadius='50%';
            return;
          }
          this.style.display='none';
          const wrap = this.parentElement;
          if(wrap && !wrap.querySelector('.fallback-letter') && !wrap.querySelector('.fav-fallback') && !wrap.querySelector('.generic-fallback')){
            const fb = document.createElement('span');
            fb.className='fallback-letter';
            const title = this.dataset.title||'?';
            fb.textContent = title.charAt(0).toUpperCase();
            fb.style.background = window.hashColor ? window.hashColor(this.dataset.pageUrl||title) : '#6b7280';
            fb.style.color='#fff';
            fb.style.width='100%';
            fb.style.height='100%';
            fb.style.display='grid';
            fb.style.placeItems='center';
            fb.style.borderRadius='50%';
            fb.style.fontWeight='700';
            wrap.appendChild(fb);
          }
        }
      });
    });
  }

setTimeout(()=>{ upgradeFavsStorage(); upgradeStoredBlocks(); enhanceImages(); }, 800);
  setTimeout(enhanceImages, 2000);
  setTimeout(enhanceImages, 4000);
  const obs = new MutationObserver(()=>{ enhanceImages(); });
  obs.observe(document.body, {childList:true, subtree:true});

  window.__faviconFix = {candidatesFor, upgradeFavsStorage, resolveGoogleIcon};
})();
</script>

  }
  function saveCache(c){
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify(c)); }catch(e){}
  }

  // When an icon loads successfully, cache it for that URL
  function cacheSuccessfulIcon(pageUrl, iconUrl){
    if(!pageUrl || !iconUrl) return;
    if(iconUrl.startsWith('data:')) return; // don't cache data URIs
    if(iconUrl===CUSTOM_FALLBACK) return;
    try{
      const cache = loadCache();
      const u = new URL(pageUrl);
      const key = u.hostname + u.pathname; // cache per page path
      const hostKey = u.hostname;
      // Save both exact URL and host
      cache[pageUrl] = iconUrl;
      cache[hostKey] = iconUrl;
      // Keep cache size limited to 200 entries
      const keys = Object.keys(cache);
      if(keys.length>200){
        // remove oldest (first)
        delete cache[keys[0]];
      }
      saveCache(cache);
    }catch(e){}
  }

  // Hook into image load events for icon-wrapper and fav-icon-wrap
  function hookImageLoad(){
    document.addEventListener('load', function(e){
      const img = e.target;
      if(!(img instanceof HTMLImageElement)) return;
      if(!img.closest('.icon-wrapper, .fav-icon-wrap')) return;
      // Find page URL from parent link
      const link = img.closest('a');
      let pageUrl = '';
      if(link && link.href) pageUrl = link.href;
      if(!pageUrl) return;
      if(img.src && img.src!==CUSTOM_FALLBACK && img.naturalWidth>0){
        cacheSuccessfulIcon(pageUrl, img.src);
        // Also save into google-portal-blocks if exists
        try{
          const blocksRaw = localStorage.getItem('google-portal-blocks');
          if(blocksRaw){
            const blocks = JSON.parse(blocksRaw);
            let changed=false;
            blocks.forEach(b=>{
              if(b.type==='row' && Array.isArray(b.apps)){
                b.apps.forEach(app=>{
                  if(app.url===pageUrl || (new URL(app.url).hostname===new URL(pageUrl).hostname && !app.icon)){
                    if(!app.icon || app.icon!==img.src){
                      // Only save if it's a good icon (not generic)
                      if(!img.src.includes('s2/favicons?domain=') || img.src.includes('t3.gstatic') || img.src.includes('api.faviconkit') || img.src.includes('icons.duckduckgo') || img.src.includes('ssl.gstatic.com')){
                        // Actually we want to save any successful non-fallback
                        app.icon = img.src;
                        changed=true;
                      }
                    }
                  }
                });
              }
            });
            if(changed) localStorage.setItem('google-portal-blocks', JSON.stringify(blocks));
          }
        }catch(e){}
      }
    }, true);
  }

  // Patch guCandidates and candidatesFor to check cache first
  const originalGuCandidates = window.guCandidates;
  if(typeof guCandidates==='function'){
    const orig = guCandidates;
    window.guCandidates = function(url){
      try{
        const cache = loadCache();
        const u = new URL(url.startsWith('http')?url:'https://'+url);
        const key = url;
        const hostKey = u.hostname;
        const cached = cache[key] || cache[hostKey] || cache[u.hostname + u.pathname];
        const list = orig(url);
        if(cached && list[0]!==cached){
          // Put cached successful icon first (matches Chrome's cache behavior)
          const filtered = list.filter(x=>x!==cached);
          return [cached, ...filtered];
        }
        return list;
      }catch(e){
        return originalGuCandidates?originalGuCandidates(url):[gu(url)];
      }
    };
  }

  // Also patch global candidatesFor if exists
  if(typeof window.__faviconFix!=='undefined' && window.__faviconFix.candidatesFor){
    const orig = window.__faviconFix.candidatesFor;
    window.__faviconFix.candidatesFor = function(url){
      try{
        const cache = loadCache();
        const u = new URL(url.startsWith('http')?url:'https://'+url);
        const cached = cache[url] || cache[u.hostname];
        const list = orig(url);
        if(cached){
          const filtered = list.filter(x=>x!==cached);
          return [cached, ...filtered];
        }
        return list;
      }catch(e){return orig(url);}
    };
  }

  // Expose cache helpers
  window.__faviconCache = {load:loadCache, save:saveCache, clear:()=>localStorage.removeItem(CACHE_KEY)};

  // Init
  hookImageLoad();
  console.log('[Favicon] Chrome-like fetching enabled, custom fallback injected, cache active');
})();
</script>





<script>
// === FIX TANGGAL DINAMIS V2 - Robust ===
(function(){
  const LOCALE = 'id-ID';
  const TIMEZONE_WIB = 'Asia/Jakarta';
  
  let formatterWIB, formatterLocal;
  try {
    formatterWIB = new Intl.DateTimeFormat(LOCALE, {
      weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: TIMEZONE_WIB
    });
  } catch(e){ formatterWIB = null; }
  try {
    formatterLocal = new Intl.DateTimeFormat(LOCALE, {
      weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
    });
  } catch(e){
    formatterLocal = null;
  }

  function getFormattedDate(d){
    d = d || new Date();
    if(formatterWIB){
      try { return formatterWIB.format(d); } catch(e){}
    }
    if(formatterLocal){
      try { return formatterLocal.format(d); } catch(e){}
    }
    // ultimate fallback manual
    const days = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
    const months = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
    return days[d.getDay()] + ', ' + d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
  }

  function updateEl(){
    const el = document.getElementById('heroDatePill');
    if(!el) return false;
    const txt = getFormattedDate(new Date());
    if(el.textContent !== txt){
      el.textContent = txt;
    }
    return true;
  }

  function getMsUntilNextMidnight(){
    const now = new Date();
    const next = new Date(now);
    next.setHours(24,0,0,0);
    return next - now + 1000;
  }

  function scheduleMidnight(){
    setTimeout(function(){
      updateEl();
      scheduleMidnight();
    }, getMsUntilNextMidnight());
  }

  function initRobust(){
    // coba langsung
    if(updateEl()){
      // kalau sudah ada, jadwalkan update tengah malam
      scheduleMidnight();
      document.addEventListener('visibilitychange', function(){
        if(document.visibilityState === 'visible') updateEl();
      });
      setInterval(updateEl, 60*1000); // cek tiap menit (aman untuk sleep)
      return;
    }

    // kalau belum ada (React belum mount), polling + MutationObserver
    let attempts = 0;
    const poll = setInterval(function(){
      attempts++;
      if(updateEl()){
        clearInterval(poll);
        if(observer) observer.disconnect();
        scheduleMidnight();
        document.addEventListener('visibilitychange', function(){
          if(document.visibilityState === 'visible') updateEl();
        });
        setInterval(updateEl, 60*1000);
      }
      if(attempts>100){ // 100 * 200ms = 20 detik
        clearInterval(poll);
      }
    }, 200);

    const observer = new MutationObserver(function(){
      if(updateEl()){
        clearInterval(poll);
        observer.disconnect();
        scheduleMidnight();
      }
    });
    observer.observe(document.documentElement, {childList:true, subtree:true});
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', initRobust);
  } else {
    initRobust();
  }
  // retry after window load (React biasanya mount setelah itu)
  window.addEventListener('load', function(){ setTimeout(updateEl, 500); setTimeout(updateEl, 1500); });

  window.__updateHeroDate = updateEl;
})();
</script>
